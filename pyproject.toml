[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-agent"
version = "0.1.0"
description = "企业知识支持与工单处理 Agent"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
demo = ["streamlit>=1.30.0", "pandas>=2.0.0"]
retrieval = ["sentence-transformers>=2.2.0", "faiss-cpu>=1.7.4"]

[tool.setuptools]
packages = ["app", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
